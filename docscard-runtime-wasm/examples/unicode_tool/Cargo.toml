[package]
name = "unicode_tool"
version = "1.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
unicode-general-category = "1.1"
# Keep character names on Unicode 16.0, matching unicode-general-category 1.1.
unicode_names2 = "=2.0.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
