name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare local mochi dependency (version from libs.versions.toml)
        run: |
          set -eo pipefail
          # mochi-* 是开发者本地 mavenLocal 的补丁产物（见 docs/mochi-migration-plan.md §12）。
          # 这里以 gradle/libs.versions.toml 里的 mochi 版本为唯一真相，避免 pin 与
          # CI 里 publish 的版本漂移（之前手写的 0.2.0/0.3.0 不一致导致 jitpack 401）。
          MOCHI_VERSION="$(sed -nE 's/^mochi[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -1)"
          [ -n "$MOCHI_VERSION" ] || { echo "::error::mochi version not found in gradle/libs.versions.toml"; exit 1; }
          BASE="${MOCHI_VERSION%-khatkit}"
          CLONE_ARGS=(--depth 1)
          if git ls-remote --tags https://github.com/feice11/mochi-compose.git "refs/tags/v$BASE" | grep -q .; then
            CLONE_ARGS+=(--branch "v$BASE")
            echo "mochi $MOCHI_VERSION -> tag v$BASE"
          else
            echo "mochi $MOCHI_VERSION -> tag v$BASE not found, build from main"
          fi
          rm -rf _mochi
          git clone "${CLONE_ARGS[@]}" https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME="$MOCHI_VERSION" --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'
      - name: Prepare signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: bash .github/scripts/prepare-signing.sh
      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每晚覆盖同一个「最新每日构建」
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk
