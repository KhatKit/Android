name: Build APK

# 手动触发的 APK 构建，产物作为 Actions artifact 上传（不发布 Release）。
# 两点说明：
#   1. release 用的是工作流里临时生成的签名密钥（CN=KhatKit CI），不是官方发布密钥。
#      包名与官方一致（heizige.kk.khatkit），签名不同，覆盖安装前需先卸载官方版。
#   2. app 依赖的 io.github.feice11:mochi-*:0.2.0-khatkit 只存在于开发者本地 mavenLocal
#      （见 docs/mochi-migration-plan.md §12），这里用公开源码
#      feice11/mochi-compose@v0.2.0 + .github/scripts/patch-mochi.py 补齐 app 需要的
#      少量 API 后 publishToMavenLocal，再构建 app。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建哪个版本'
        required: true
        default: both
        type: choice
        options:
          - both
          - debug
          - release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: debug APK
    if: github.event.inputs.variant != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local mochi dependency (io.github.feice11:*:0.2.0-khatkit)
        run: |
          git clone --depth 1 --branch v0.2.0 https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME=0.2.0-khatkit --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  build-release:
    name: release APK
    if: github.event.inputs.variant != 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local mochi dependency (io.github.feice11:*:0.2.0-khatkit)
        run: |
          git clone --depth 1 --branch v0.2.0 https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME=0.2.0-khatkit --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'

      # 仓库里没有官方签名密钥的 secrets，用临时密钥签一个"可安装"的包；官方发布请走
      # daily-build.yml（需要 secrets: KEY_BASE64 / SIGNING_CONFIG）。
      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/app/ci-release.jks" \
            -storepass android -keypass android \
            -alias khatkit-ci -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=KhatKit CI, OU=CI, O=KhatKit, L=CI, S=CI, C=CN"
          printf 'storeFile=%s/app/ci-release.jks\nstorePassword=android\nkeyAlias=khatkit-ci\nkeyPassword=android\n' "$GITHUB_WORKSPACE" > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
