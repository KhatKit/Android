name: Build APK

# 手动触发的 APK 构建，产物作为 Actions artifact 上传（不发布 Release）。
# 两点说明：
#   1. release 用仓库 secrets 里的项目签名密钥（KEY_BASE64 + SIGNING_CONFIG，alias/password
#      均为 khatkit，见 docs/release-signing.md）。没有配置这两个 secrets 时（例如 fork）
#      退化为一次性临时密钥。
#   2. app 依赖的 mochi-* 目前是开发者本地 mavenLocal 的补丁产物（见
#      docs/mochi-migration-plan.md §12）。CI 以 gradle/libs.versions.toml 的 mochi
#      版本为准，用公开源码 + .github/scripts/patch-mochi.py 补齐少量 API 后
#      publishToMavenLocal，再构建 app（版本漂移不会再 401）。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建哪个版本'
        required: true
        default: both
        type: choice
        options:
          - both
          - debug
          - release
      versionCode:
        description: 'Android versionCode（必须高于当前线上版本）'
        required: true
        default: '192'
        type: string
      versionName:
        description: '展示给用户的版本名'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: debug APK
    if: github.event.inputs.variant != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local mochi dependency (version from libs.versions.toml)
        run: |
          set -eo pipefail
          # mochi-* 是开发者本地 mavenLocal 的补丁产物（见 docs/mochi-migration-plan.md §12）。
          # 这里以 gradle/libs.versions.toml 里的 mochi 版本为唯一真相，避免 pin 与
          # CI 里 publish 的版本漂移（之前手写的 0.2.0/0.3.0 不一致导致 jitpack 401）。
          MOCHI_VERSION="$(sed -nE 's/^mochi[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -1)"
          [ -n "$MOCHI_VERSION" ] || { echo "::error::mochi version not found in gradle/libs.versions.toml"; exit 1; }
          BASE="${MOCHI_VERSION%-khatkit}"
          CLONE_ARGS=(--depth 1)
          if git ls-remote --tags https://github.com/feice11/mochi-compose.git "refs/tags/v$BASE" | grep -q .; then
            CLONE_ARGS+=(--branch "v$BASE")
            echo "mochi $MOCHI_VERSION -> tag v$BASE"
          else
            echo "mochi $MOCHI_VERSION -> tag v$BASE not found, build from main"
          fi
          rm -rf _mochi
          git clone "${CLONE_ARGS[@]}" https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME="$MOCHI_VERSION" --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PVERSION_CODE="${{ inputs.versionCode }}" \
            -PVERSION_NAME="${{ inputs.versionName }}" \
            --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  build-release:
    name: release APK
    if: github.event.inputs.variant != 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local mochi dependency (version from libs.versions.toml)
        run: |
          set -eo pipefail
          # mochi-* 是开发者本地 mavenLocal 的补丁产物（见 docs/mochi-migration-plan.md §12）。
          # 这里以 gradle/libs.versions.toml 里的 mochi 版本为唯一真相，避免 pin 与
          # CI 里 publish 的版本漂移（之前手写的 0.2.0/0.3.0 不一致导致 jitpack 401）。
          MOCHI_VERSION="$(sed -nE 's/^mochi[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -1)"
          [ -n "$MOCHI_VERSION" ] || { echo "::error::mochi version not found in gradle/libs.versions.toml"; exit 1; }
          BASE="${MOCHI_VERSION%-khatkit}"
          CLONE_ARGS=(--depth 1)
          if git ls-remote --tags https://github.com/feice11/mochi-compose.git "refs/tags/v$BASE" | grep -q .; then
            CLONE_ARGS+=(--branch "v$BASE")
            echo "mochi $MOCHI_VERSION -> tag v$BASE"
          else
            echo "mochi $MOCHI_VERSION -> tag v$BASE not found, build from main"
          fi
          rm -rf _mochi
          git clone "${CLONE_ARGS[@]}" https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME="$MOCHI_VERSION" --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'
      # release 签名：优先用仓库 secrets 里的密钥（KEY_BASE64 / SIGNING_CONFIG），
      # 没配置时退化为一次性临时密钥（fork 场景），保证仍能产出可安装的包。
      - name: Prepare signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: bash .github/scripts/prepare-signing.sh
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PVERSION_CODE="${{ inputs.versionCode }}" \
            -PVERSION_NAME="${{ inputs.versionName }}" \
            --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
