name: Build APK

# 手动触发的 APK 构建，产物作为 Actions artifact 上传（不发布 Release）。
# 两点说明：
#   1. release 用仓库 secrets 里的项目签名密钥（KEY_BASE64 + SIGNING_CONFIG，alias/password
#      均为 khatkit，见 docs/release-signing.md）。没有配置这两个 secrets 时（例如 fork）
#      退化为一次性临时密钥。
#   2. app 依赖的 io.github.feice11:mochi-*:0.3.0-khatkit 只存在于开发者本地 mavenLocal
#      （见 docs/mochi-migration-plan.md §12），这里用公开源码
#      feice11/mochi-compose@main + .github/scripts/patch-mochi.py 补齐 app 需要的
#      少量 API 后 publishToMavenLocal，再构建 app。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建哪个版本'
        required: true
        default: both
        type: choice
        options:
          - both
          - debug
          - release
      versionCode:
        description: 'Android versionCode（必须高于当前线上版本）'
        required: true
        default: '192'
        type: string
      versionName:
        description: '展示给用户的版本名'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: debug APK
    if: github.event.inputs.variant != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local mochi dependency (io.github.feice11:*:0.2.0-khatkit)
        run: |
          git clone --depth 1 https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME=0.3.0-khatkit --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PVERSION_CODE="${{ inputs.versionCode }}" \
            -PVERSION_NAME="${{ inputs.versionName }}" \
            --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  build-release:
    name: release APK
    if: github.event.inputs.variant != 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local mochi dependency (io.github.feice11:*:0.2.0-khatkit)
        run: |
          git clone --depth 1 https://github.com/feice11/mochi-compose.git _mochi
          python3 .github/scripts/patch-mochi.py _mochi
          cd _mochi
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PVERSION_NAME=0.3.0-khatkit --stacktrace
          find ~/.m2/repository/io/github/feice11 -name '*.aar' -printf '%p %s bytes\n'

      # release 签名：优先用仓库 secrets 里的密钥（KEY_BASE64 / SIGNING_CONFIG），
      # 没配置时退化为一次性临时密钥（fork 场景），保证仍能产出可安装的包。
      - name: Prepare signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            printf '%s\n' "$SIGNING_CONFIG" > local.properties
            echo "using repository signing key"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/app/ci-release.jks" \
              -storepass android -keypass android \
              -alias khatkit-ci -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=KhatKit CI, OU=CI, O=KhatKit, L=CI, S=CI, C=CN"
            printf 'storeFile=%s/app/ci-release.jks\nstorePassword=android\nkeyAlias=khatkit-ci\nkeyPassword=android\n' "$GITHUB_WORKSPACE" > local.properties
            echo "WARNING: KEY_BASE64/SIGNING_CONFIG secrets not configured, fell back to a throwaway key"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PVERSION_CODE="${{ inputs.versionCode }}" \
            -PVERSION_NAME="${{ inputs.versionName }}" \
            --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatkit-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
